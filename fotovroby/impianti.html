<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impianti · fotovroby</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>fotovroby</h1>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="scadenziario.html">Scadenziario</a>
    <a href="progetti.html">Progetti</a>
    <a href="autorizzazioni.html">Autorizzazioni</a>
    <a href="attivi.html">Attivi</a>
    <a href="impianti.html" class="active">Impianti</a>
    <a href="interventi.html">Interventi</a>
    <a href="clienti.html">Clienti</a>
    <a href="tecnici.html">Tecnici</a>
    <span class="user-info" id="user-nome"></span>
    <button onclick="logout()">Esci</button>
  </nav>
</header>
<main>
  <div id="loading" class="loading">Caricamento...</div>
  <div id="content" style="display:none">

    <div class="card">
      <div class="toolbar">
        <button class="btn-primary" onclick="apriNuovoImpianto()">+ Nuovo</button>
        <div class="filtri" style="flex:1">
          <div class="filtro"><label>Fase</label>
            <select id="f-fase">
              <option value="">Tutte</option>
              <option value="progettuale">Progetto</option>
              <option value="autorizzazione">Autorizzazione</option>
              <option value="attivo">Attivo</option>
              <option value="dismesso">Dismesso</option>
            </select>
          </div>
          <div class="filtro"><label>Cliente</label><select id="f-cliente"><option value="">Tutti</option></select></div>
          <div class="filtro"><label>Fascia</label>
            <select id="f-fascia">
              <option value="">Tutte</option>
              <option value="F1 fino a 11,08 kW">F1</option>
              <option value="F2 11,08-20 kW">F2</option>
              <option value="F3 oltre 20 kW">F3</option>
            </select>
          </div>
          <div class="filtro"><label>Install.</label>
            <select id="f-install">
              <option value="">Tutti</option>
              <option value="tetto">Tetto</option>
              <option value="terra">Terra</option>
              <option value="float">Float</option>
              <option value="tracker">Tracker</option>
            </select>
          </div>
          <div class="filtro"><label>Cerca</label><input type="text" id="f-testo" placeholder="Codice, nome..."></div>
        </div>
        <div class="tot-info">Totale: <b id="cnt-tot">0</b></div>
      </div>
      <div class="contatori" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <span class="chip chip-info" id="cnt-prog">0 progetti</span>
        <span class="chip chip-warn" id="cnt-aut">0 autorizzazione</span>
        <span class="chip chip-success" id="cnt-att">0 attivi</span>
        <span class="chip" id="cnt-dis">0 dismessi</span>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table class="tab-scadenze">
          <thead><tr>
            <th>Codice</th><th>Nome</th><th>Cliente</th><th>Potenza</th><th>Fascia</th>
            <th>Install.</th><th>Conn.</th><th>Comune</th><th>Fase</th><th>Azioni</th>
          </tr></thead>
          <tbody id="tab-body"><tr><td colspan="10" class="loading">Caricamento...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/partial-loader.js"></script>
<script src="js/impianti-common.js"></script>
<script src="js/impianti.js"></script>
</body>
</html>
