<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scadenziario · fotovroby</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>fotovroby</h1>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="scadenziario.html" class="active">Scadenziario</a>
    <a href="impianti.html">Impianti</a>
    <a href="clienti.html">Clienti</a>
    <span class="user-info" id="user-nome"></span>
    <button onclick="logout()">Esci</button>
  </nav>
</header>

<main>
  <div id="loading" class="loading">Caricamento...</div>
  <div id="content" style="display:none">

    <div class="card">
      <div class="filtri">
        <div class="filtro">
          <label>Semaforo</label>
          <select id="f-semaforo">
            <option value="">Tutti</option>
            <option value="rosso">Scadute</option>
            <option value="giallo">In scadenza</option>
            <option value="verde">Future</option>
          </select>
        </div>
        <div class="filtro">
          <label>Categoria</label>
          <select id="f-categoria">
            <option value="">Tutte</option>
            <option value="manutenzione">Manutenzione</option>
            <option value="verifica">Verifica</option>
            <option value="adempimento">Adempimento</option>
            <option value="garanzia">Garanzia</option>
          </select>
        </div>
        <div class="filtro">
          <label>Cliente</label>
          <select id="f-cliente"><option value="">Tutti</option></select>
        </div>
        <div class="filtro">
          <label>Fascia</label>
          <select id="f-fascia">
            <option value="">Tutte</option>
            <option value="F1 fino a 11,08 kW">F1 fino a 11,08 kW</option>
            <option value="F2 11,08-20 kW">F2 11,08-20 kW</option>
            <option value="F3 oltre 20 kW">F3 oltre 20 kW</option>
          </select>
        </div>
        <div class="filtro">
          <label>Cerca</label>
          <input type="text" id="f-testo" placeholder="Impianto, descrizione...">
        </div>
        <div class="filtro">
          <label>&nbsp;</label>
          <button class="btn-secondary" onclick="resetFiltri()">Azzera</button>
        </div>
      </div>
      <div class="contatori">
        <span class="badge rosso" id="cnt-rosso">0 scadute</span>
        <span class="badge giallo" id="cnt-giallo">0 in scadenza</span>
        <span class="badge verde" id="cnt-verde">0 future</span>
        <span class="tot">Totale visualizzate: <b id="cnt-tot">0</b></span>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table class="tab-scadenze">
          <thead>
            <tr>
              <th>Scadenza</th>
              <th>Cliente</th>
              <th>Impianto</th>
              <th>Descrizione</th>
              <th>Categoria</th>
              <th>Stato</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="tab-body">
            <tr><td colspan="7" class="loading">Caricamento...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="modal" id="modal-pianifica">
  <div class="modal-content">
    <h2>Pianifica intervento</h2>
    <div id="mp-info" class="modal-info"></div>
    <div class="form-group">
      <label>Data pianificata</label>
      <input type="date" id="mp-data">
    </div>
    <div class="form-group">
      <label>Tecnico assegnato</label>
      <input type="text" id="mp-tecnico" placeholder="Nome tecnico">
    </div>
    <div class="form-group">
      <label>Note</label>
      <textarea id="mp-note" rows="3"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="chiudiModal('modal-pianifica')">Annulla</button>
      <button class="btn-primary" onclick="confermaPianifica()">Pianifica</button>
    </div>
  </div>
</div>

<div class="modal" id="modal-eseguito">
  <div class="modal-content">
    <h2>Segna come eseguito</h2>
    <div id="me-info" class="modal-info"></div>
    <div class="form-group">
      <label>Data intervento</label>
      <input type="date" id="me-data">
    </div>
    <div class="form-group">
      <label>Tecnico</label>
      <input type="text" id="me-tecnico">
    </div>
    <div class="form-group">
      <label>Esito</label>
      <select id="me-esito">
        <option value="ok">OK</option>
        <option value="ok_con_note">OK con note</option>
        <option value="anomalia">Anomalia rilevata</option>
        <option value="da_ripetere">Da ripetere</option>
      </select>
    </div>
    <div class="form-group">
      <label>Ore lavorate</label>
      <input type="number" id="me-ore" step="0.5" min="0" value="1">
    </div>
    <div class="form-group">
      <label>Costo materiali (€)</label>
      <input type="number" id="me-costo" step="0.01" min="0" value="0">
    </div>
    <div class="form-group">
      <label>Descrizione / note</label>
      <textarea id="me-descrizione" rows="3"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="chiudiModal('modal-eseguito')">Annulla</button>
      <button class="btn-primary" onclick="confermaEseguito()">Registra intervento</button>
    </div>
  </div>
</div>

<!-- Modale modifica/rimanda scadenza -->
<div class="modal" id="modal-edit-scad">
  <div class="modal-content">
    <h2>Modifica scadenza</h2>
    <div id="mes-info" class="modal-info"></div>
    <div class="form-group">
      <label>Data scadenza</label>
      <input type="date" id="mes-data">
    </div>
    <div class="quick-actions">
      <span class="text-muted">Rimanda di:</span>
      <button class="btn-secondary btn-sm" onclick="rimanda(7)">+7 gg</button>
      <button class="btn-secondary btn-sm" onclick="rimanda(30)">+30 gg</button>
      <button class="btn-secondary btn-sm" onclick="rimanda(90)">+3 mesi</button>
      <button class="btn-secondary btn-sm" onclick="rimanda(365)">+1 anno</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Giorni preavviso</label>
        <input type="number" id="mes-preavviso" min="1">
      </div>
      <div class="form-group">
        <label>Stato</label>
        <select id="mes-stato">
          <option value="aperta">Aperta</option>
          <option value="pianificata">Pianificata</option>
          <option value="annullata">Annullata</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Note</label>
      <textarea id="mes-note" rows="2" placeholder="Motivo del rimando..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="chiudiModal('modal-edit-scad')">Annulla</button>
      <button class="btn-primary" onclick="confermaModificaScad()">Salva</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/scadenziario.js"></script>
</body>
</html>
